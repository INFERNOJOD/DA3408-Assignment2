apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spam-api
  template:
    metadata:
      labels:
        app: spam-api
    spec:
      containers:
        - name: spam-api
          image: spam-api:multi
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: spam-api-service
spec:
  selector:
    app: spam-api
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort
